<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#3584e4"/>
  
  <!-- Package box -->
  <g transform="translate(16, 18)">
    <!-- Box top -->
    <path d="M16,0 L32,-8 L48,0 L32,8 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Box front -->
    <path d="M0,8 L16,0 L32,0 L16,8 Z" fill="#e0e0e0"/>
    <!-- Box side -->
    <path d="M32,0 L48,0 L48,24 L32,24 Z" fill="#cccccc"/>
    
    <!-- Arrow down (install) -->
    <path d="M24,10 L32,18 L40,10 M32,18 L32,28" stroke="#3584e4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Double click indicator -->
    <circle cx="44" cy="4" r="4" fill="#3584e4" opacity="0.7"/>
    <circle cx="44" cy="4" r="2" fill="#ffffff"/>
  </g>
</svg>